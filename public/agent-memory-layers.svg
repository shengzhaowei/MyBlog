<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1200" height="560" fill="#fffaf0"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#222222">三层记忆：越快越小，越久越大</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#666666">跟 CPU 缓存一个道理：L1 快而小，磁盘慢而大，靠分层各取所需</text>

  <!-- L1 -->
  <rect x="80" y="110" width="1040" height="110" rx="14" fill="#eef6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="152" font-size="20" font-weight="700" fill="#0f766e">L1 · 工作记忆</text>
  <text x="140" y="184" font-size="16" fill="#444444">本轮 messages，内存里，进程一退就没了</text>
  <text x="1060" y="152" text-anchor="end" font-size="16" fill="#0f766e">快 · 小 · 一轮</text>
  <text x="1060" y="184" text-anchor="end" font-size="16" fill="#666666">模型每轮都看它</text>

  <!-- arrow down -->
  <line x1="600" y1="220" x2="600" y2="255" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="620" y="242" font-size="15" fill="#0f766e">值得留的才往下写</text>

  <!-- L2 -->
  <rect x="80" y="260" width="1040" height="110" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="140" y="302" font-size="20" font-weight="700" fill="#0f766e">L2 · 长期记忆</text>
  <text x="140" y="334" font-size="16" fill="#444444">USER.md（画像）+ MEMORY.md（事实），磁盘上，启动时全量读回</text>
  <text x="1060" y="302" text-anchor="end" font-size="16" fill="#0f766e">慢一点 · 精简 · 跨会话</text>
  <text x="1060" y="334" text-anchor="end" font-size="16" fill="#666666">最小版上限 2000 字</text>

  <line x1="600" y1="370" x2="600" y2="405" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="620" y="392" font-size="15" fill="#0f766e">想翻原话时才往下找</text>

  <!-- L3 -->
  <rect x="80" y="410" width="1040" height="110" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="140" y="452" font-size="20" font-weight="700" fill="#222222">L3 · 情景记忆</text>
  <text x="140" y="484" font-size="16" fill="#444444">sessions.jsonl，每轮原样追加，只追加不改写</text>
  <text x="1060" y="452" text-anchor="end" font-size="16" fill="#444444">最慢 · 最全 · 可翻旧账</text>
  <text x="1060" y="484" text-anchor="end" font-size="16" fill="#666666">关键词搜，不进启动 prompt</text>
</svg>
