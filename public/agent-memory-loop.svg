<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#fffaf0"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#222222">记忆不是一个文件，是一个循环</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#666666">上下文产生记忆，记忆回到上下文——关掉进程，循环不断</text>

  <!-- top: context -->
  <rect x="420" y="110" width="360" height="100" rx="14" fill="#eef6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="600" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">① 上下文（本轮）</text>
  <text x="600" y="184" text-anchor="middle" font-size="16" fill="#444444">messages：系统提示词 + 对话 + 工具结果</text>

  <!-- right: extract -->
  <line x1="780" y1="160" x2="880" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="830" y="142" text-anchor="middle" font-size="15" fill="#0f766e">值得记的</text>
  <rect x="890" y="110" width="250" height="100" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="1015" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">② 写记忆</text>
  <text x="1015" y="184" text-anchor="middle" font-size="16" fill="#444444">memory 工具：add / replace</text>

  <!-- down to disk -->
  <line x1="1015" y1="210" x2="1015" y2="300" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <rect x="760" y="310" width="380" height="110" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="950" y="352" text-anchor="middle" font-size="20" font-weight="700" fill="#222222">③ 磁盘上的记忆（跨会话）</text>
  <text x="950" y="384" text-anchor="middle" font-size="16" fill="#444444">USER.md · MEMORY.md · sessions.jsonl</text>

  <!-- left to recall -->
  <line x1="760" y1="365" x2="330" y2="365" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrAmber)"/>
  <text x="545" y="348" text-anchor="middle" font-size="15" fill="#b45309">下个会话启动时读回</text>
  <rect x="60" y="310" width="260" height="110" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="190" y="352" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">④ 召回</text>
  <text x="190" y="384" text-anchor="middle" font-size="16" fill="#444444">拼进 system prompt</text>

  <!-- back up to context -->
  <line x1="190" y1="310" x2="470" y2="212" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrAmber)"/>
  <text x="300" y="240" text-anchor="middle" font-size="15" fill="#b45309">模型又能“记得”了</text>

  <rect x="60" y="460" width="1080" height="56" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="600" y="495" text-anchor="middle" font-size="17" fill="#444444">只写不读，记忆是死档；只读不写，记忆是旧报纸。循环转起来才叫记忆系统。</text>
</svg>
