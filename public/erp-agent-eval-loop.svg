<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#fffaf0"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#222222">评测闭环：每次改动都能被分数抓住</text>

  <!-- step 1 -->
  <rect x="50" y="100" width="200" height="120" rx="14" fill="#eef6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="150" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">① 黄金题库</text>
  <text x="150" y="176" text-anchor="middle" font-size="16" fill="#444444">问题 + 标准 SQL</text>
  <text x="150" y="202" text-anchor="middle" font-size="16" fill="#444444">+ 标准答案</text>

  <line x1="250" y1="160" x2="290" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- step 2 -->
  <rect x="290" y="100" width="200" height="120" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="390" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">② 运行评测</text>
  <text x="390" y="176" text-anchor="middle" font-size="16" fill="#444444">一题题问 Agent</text>
  <text x="390" y="202" text-anchor="middle" font-size="16" fill="#444444">记录 SQL 与答案</text>

  <line x1="490" y1="160" x2="530" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- step 3 -->
  <rect x="530" y="100" width="200" height="120" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="630" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">③ 比对结果</text>
  <text x="630" y="176" text-anchor="middle" font-size="16" fill="#444444">比 SQL 的执行结果</text>
  <text x="630" y="202" text-anchor="middle" font-size="16" fill="#444444">不比 SQL 字符串</text>

  <line x1="730" y1="160" x2="770" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- step 4 -->
  <rect x="770" y="100" width="200" height="120" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="870" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">④ 失败分类</text>
  <text x="870" y="176" text-anchor="middle" font-size="16" fill="#444444">路由错 / 口径错</text>
  <text x="870" y="202" text-anchor="middle" font-size="16" fill="#444444">权限错 / 编造答案</text>

  <line x1="970" y1="160" x2="1010" y2="160" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- step 5 -->
  <rect x="1010" y="100" width="140" height="120" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="1080" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">⑤ 修复</text>
  <text x="1080" y="176" text-anchor="middle" font-size="16" fill="#444444">改注解、改提示词</text>
  <text x="1080" y="202" text-anchor="middle" font-size="16" fill="#444444">改护栏</text>

  <!-- return arrow -->
  <path d="M 1080 220 L 1080 300 L 150 300 L 150 232" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arr3)"/>
  <text x="600" y="282" text-anchor="middle" font-size="18" font-weight="700" fill="#b45309">回归：分数掉了，说明改坏了</text>

  <!-- bottom notes -->
  <rect x="50" y="340" width="1100" height="150" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="90" y="382" font-size="18" font-weight="700" fill="#222222">三条规矩</text>
  <text x="90" y="416" font-size="17" fill="#444444">· 先跑基线再改动：没有基线分数，调优就是凭感觉</text>
  <text x="90" y="446" font-size="17" fill="#444444">· 失败要分类：路由错改语义层，口径错补注解，编造加护栏——分类之后才知道改哪里</text>
  <text x="90" y="476" font-size="17" fill="#444444">· 真实问题要回流：上线后把用户问过的问题采样、标注，好的补进题库</text>
</svg>
