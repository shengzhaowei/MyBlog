<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#fffaf0"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#222222">两派记忆：文件派 vs 数据库派</text>
  <text x="600" y="84" text-anchor="middle" font-size="16" fill="#666666">同一个问题，两种答案：启动时全读，还是用时现搜</text>

  <!-- left: file -->
  <rect x="60" y="110" width="520" height="330" rx="14" fill="#eef6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="320" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">文件派：启动全量读</text>
  <text x="320" y="190" text-anchor="middle" font-size="16" fill="#444444">Claude Code · Codex · Hermes</text>
  <text x="320" y="228" text-anchor="middle" font-size="16" fill="#444444">CLAUDE.md / AGENTS.md</text>
  <text x="320" y="258" text-anchor="middle" font-size="16" fill="#444444">USER.md / MEMORY.md</text>
  <text x="320" y="296" text-anchor="middle" font-size="16" fill="#444444">人能打开看、改、删</text>
  <text x="320" y="334" text-anchor="middle" font-size="16" fill="#444444">简单、可审计、有上限</text>
  <text x="320" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">适合：单人、单机、量小</text>

  <!-- right: db -->
  <rect x="620" y="110" width="520" height="330" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="880" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#b45309">数据库派：用时现搜</text>
  <text x="880" y="190" text-anchor="middle" font-size="16" fill="#444444">LangGraph · Google ADK · CrewAI</text>
  <text x="880" y="228" text-anchor="middle" font-size="16" fill="#444444">Checkpointer + Store / Memory Bank</text>
  <text x="880" y="258" text-anchor="middle" font-size="16" fill="#444444">按用户、按实体、按向量搜</text>
  <text x="880" y="296" text-anchor="middle" font-size="16" fill="#444444">只给最相关的几条</text>
  <text x="880" y="334" text-anchor="middle" font-size="16" fill="#444444">能存很多，但要挑、要排</text>
  <text x="880" y="380" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">适合：多人、量大、要检索</text>

  <line x1="580" y1="275" x2="620" y2="275" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="600" y="250" text-anchor="middle" font-size="15" fill="#666666">量变大 →</text>

  <rect x="60" y="470" width="1080" height="56" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="600" y="505" text-anchor="middle" font-size="17" fill="#444444">先走左派，量上来了再走右派——顺序反了，就是给小项目背数据库的债。</text>
</svg>
