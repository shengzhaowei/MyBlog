<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#fffaf0"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#222222">语义层：先找对表，再写对 SQL</text>

  <!-- step 1 -->
  <rect x="60" y="100" width="250" height="130" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="185" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">① 中文问题</text>
  <text x="185" y="176" text-anchor="middle" font-size="17" fill="#444444">「某车间今年销量多少？」</text>
  <text x="185" y="204" text-anchor="middle" font-size="16" fill="#888888">口语、简称、模糊指代</text>

  <line x1="310" y1="165" x2="350" y2="165" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- step 2 -->
  <rect x="350" y="100" width="250" height="130" rx="14" fill="#eef6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="475" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">② 表路由</text>
  <text x="475" y="176" text-anchor="middle" font-size="17" fill="#444444">按注解找到相关表</text>
  <text x="475" y="204" text-anchor="middle" font-size="16" fill="#888888">发货明细表 · 生产订单表</text>

  <line x1="600" y1="165" x2="640" y2="165" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- step 3 -->
  <rect x="640" y="100" width="250" height="130" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="765" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">③ 口径与 SQL</text>
  <text x="765" y="176" text-anchor="middle" font-size="17" fill="#444444">按业务口径生成 SQL</text>
  <text x="765" y="204" text-anchor="middle" font-size="16" fill="#888888">只读 · 白名单 · 限行数</text>

  <line x1="890" y1="165" x2="930" y2="165" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr2)"/>

  <!-- step 4 -->
  <rect x="930" y="100" width="210" height="130" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="1035" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">④ 答案与依据</text>
  <text x="1035" y="176" text-anchor="middle" font-size="17" fill="#444444">数字 + 查了哪张表</text>
  <text x="1035" y="204" text-anchor="middle" font-size="16" fill="#888888">可复核，才可信</text>

  <!-- examples -->
  <text x="60" y="300" font-size="19" font-weight="700" fill="#222222">口径写错，数字全错 —— 两个例子：</text>

  <rect x="60" y="322" width="540" height="110" rx="12" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="90" y="360" font-size="18" font-weight="700" fill="#b45309">销量 ≠ 数量求和</text>
  <text x="90" y="392" font-size="17" fill="#444444">销量 = 数量 × 换算系数，再求和</text>
  <text x="90" y="418" font-size="16" fill="#888888">直接 SUM(数量) 会把不同包装规格混在一起</text>

  <rect x="620" y="322" width="520" height="110" rx="12" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="650" y="360" font-size="18" font-weight="700" fill="#b45309">库存 ≠ 物料主数据的阈值</text>
  <text x="650" y="392" font-size="17" fill="#444444">真实库存看库存汇总表</text>
  <text x="650" y="418" font-size="16" fill="#888888">主数据里的安全库存只是预警线，不是现货</text>

  <rect x="60" y="462" width="1080" height="72" rx="12" fill="#f5efe0"/>
  <text x="600" y="492" text-anchor="middle" font-size="18" fill="#444444">每张表一份注解：业务含义 · 关键字段 · 口径 · 示例 SQL —— 注解是唯一可编辑的源头</text>
  <text x="600" y="520" text-anchor="middle" font-size="16" fill="#888888">改口径只改注解，表路由和 SQL 生成跟着变</text>
</svg>
