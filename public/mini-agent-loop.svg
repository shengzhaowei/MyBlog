<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1200" height="540" fill="#fffaf0"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#222222">Agent 的全部：一个循环</text>

  <!-- step 1 -->
  <rect x="60" y="90" width="200" height="110" rx="14" fill="#eef6f3" stroke="#0f766e" stroke-width="2"/>
  <text x="160" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">① 用户提问</text>
  <text x="160" y="166" text-anchor="middle" font-size="16" fill="#444444">一句话进 messages</text>

  <line x1="260" y1="145" x2="330" y2="145" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 2 : decision -->
  <rect x="340" y="90" width="260" height="110" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="470" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">② 模型决策</text>
  <text x="470" y="166" text-anchor="middle" font-size="16" fill="#444444">调工具？还是直接回答？</text>

  <!-- branch to answer -->
  <line x1="600" y1="145" x2="890" y2="145" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="745" y="128" text-anchor="middle" font-size="15" fill="#0f766e">不调工具了</text>

  <!-- step 5 : answer -->
  <rect x="900" y="90" width="240" height="110" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="1020" y="132" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">⑤ 输出答案</text>
  <text x="1020" y="166" text-anchor="middle" font-size="16" fill="#444444">不再调工具，就回答用户</text>

  <!-- branch down to tools -->
  <line x1="420" y1="200" x2="420" y2="290" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="436" y="252" font-size="15" fill="#0f766e">要调工具</text>

  <!-- step 3 -->
  <rect x="340" y="300" width="260" height="110" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="470" y="342" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">③ 执行工具</text>
  <text x="470" y="376" text-anchor="middle" font-size="16" fill="#444444">跑函数，把结果拿回来</text>

  <line x1="600" y1="355" x2="670" y2="355" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- step 4 -->
  <rect x="680" y="300" width="260" height="110" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="810" y="342" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">④ 结果回填</text>
  <text x="810" y="376" text-anchor="middle" font-size="16" fill="#444444">以 tool 角色 append 进历史</text>

  <!-- loop back : 4 -> 2 -->
  <path d="M 810 300 L 810 250 L 520 250 L 520 212" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrAmber)"/>
  <text x="665" y="234" text-anchor="middle" font-size="16" font-weight="700" fill="#b45309">再问一次模型</text>

  <!-- bottom note -->
  <rect x="60" y="450" width="1080" height="56" rx="14" fill="#ffffff" stroke="#d8cfc0" stroke-width="1.5"/>
  <text x="600" y="485" text-anchor="middle" font-size="17" fill="#444444">模型只负责说：调什么工具、说什么话。代码负责做：真的执行、把结果带回来。</text>
</svg>
